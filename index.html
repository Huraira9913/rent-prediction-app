<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rent Prediction App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1d2671, #c33764);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            width: 420px;
            max-width: 95%;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1d2671;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            font-size: 14px;
            color: #333;
            margin-top: 12px;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus, select:focus {
            border-color: #1d2671;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f3f6ff;
            border-left: 5px solid #1d2671;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result h2 {
            margin: 0;
            color: #1d2671;
        }

        .error {
            margin-top: 15px;
            color: red;
            font-size: 14px;
            text-align: center;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏠 Rent Prediction</h1>
    <p class="subtitle">AI-powered rental price estimation</p>

    <label>Distance from City Center (km)</label>
    <input id="distance" type="number" placeholder="e.g. 5">

    <label>Furnished</label>
    <select id="furnished">
        <option value="">Select</option>
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <label>House Size (sqft)</label>
    <input id="size" type="number" placeholder="e.g. 1200">

    <label>Number of Balconies</label>
    <input id="balconies" type="number" placeholder="e.g. 2">

    <button onclick="predictRent()">Predict Rent</button>

    <div class="result" id="resultBox">
        <h2 id="resultText"></h2>
    </div>

    <div class="error" id="errorText"></div>

    <footer>
        © 2025 Rent Prediction System
    </footer>
</div>

<script>
function predictRent() {
    const distance = document.getElementById("distance").value;
    const furnished = document.getElementById("furnished").value;
    const size = document.getElementById("size").value;
    const balconies = document.getElementById("balconies").value;

    const errorText = document.getElementById("errorText");
    const resultBox = document.getElementById("resultBox");
    const resultText = document.getElementById("resultText");

    errorText.innerText = "";
    resultBox.style.display = "none";

    if (!distance || furnished === "" || !size || !balconies) {
        errorText.innerText = "Please fill all fields correctly.";
        return;
    }

    const data = {
        city_center_distance_km: parseFloat(distance),
        furnished: parseInt(furnished),
        house_size_sqft: parseFloat(size),
        num_balconies: parseInt(balconies)
    };

    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(response => {
        resultText.innerText = "Estimated Rent: ₹ " + response.predicted_rent;
        resultBox.style.display = "block";
    })
    .catch(() => {
        errorText.innerText = "Server error. Please try again.";
    });
}
</script>

</body>
</html>
